<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title data-i18n-title="meta.title.canceled">Checkout canceled</title>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<script src="config.js"></script>
<script src="i18n.js"></script>
<script src="fab.js"></script>
</head>
<body>
<nav class="nav"><div class="wrap"><a class="brand" href="index.html"><span class="logo">F</span> <span data-brand>FabFlow</span></a>
  <div class="links"><span class="lang-switch" data-lang-switch></span></div></div></nav>
<div class="shell">
  <div class="panel center">
    <div style="font-size:46px;margin-bottom:10px">🛒</div>
    <h2 data-i18n="canceled.h2">Checkout not completed</h2>
    <div class="sub" data-i18n="canceled.sub">Nothing was charged. You can try again anytime.</div>
    <div style="display:flex;flex-direction:column;gap:10px;margin-top:8px">
      <a class="btn btn-primary btn-lg" href="index.html#pricing" data-i18n="canceled.back">Back to plans →</a>
      <a class="btn" href="account.html" data-i18n="canceled.account">My account</a>
    </div>
    <div class="muted-link" style="margin-top:20px"><span data-i18n="canceled.help">Need help?</span> <a id="sup" href="#" data-i18n="canceled.contact">Contact us</a></div>
  </div>
</div>
<script>
document.querySelectorAll("[data-brand]").forEach(function(el){ el.textContent = (window.FABSUITE&&FABSUITE.BRAND)||"FabFlow"; });
if(FABSUITE.SUPPORT_EMAIL) document.getElementById("sup").href="mailto:"+FABSUITE.SUPPORT_EMAIL;
</script>
</body>
</html>
