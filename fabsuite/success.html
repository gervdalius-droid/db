<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title data-i18n-title="meta.title.success">You're all set</title>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<script src="config.js"></script>
<script src="i18n.js"></script>
<script src="fab.js"></script>
</head>
<body>
<nav class="nav"><div class="wrap"><a class="brand" href="index.html"><span class="logo">F</span> <span data-brand>CraftOS</span></a>
  <div class="links"><span class="lang-switch" data-lang-switch></span></div></div></nav>
<div class="shell">
  <div class="panel center">
    <div style="font-size:46px;margin-bottom:10px">🎉</div>
    <h2 data-i18n="success.h2">Your workspace is ready!</h2>
    <div class="sub" data-i18n="success.sub">Your 14-day free trial has started.</div>
    <div style="background:var(--surface2);border:1px solid var(--border);border-radius:12px;padding:16px;margin:8px 0 22px">
      <div style="font-size:12px;color:var(--muted)" data-i18n="success.code_label">Workspace code</div>
      <div class="mono" id="ws" style="font-size:26px;font-weight:700;letter-spacing:.08em">—</div>
      <div style="font-size:12px;color:var(--hint);margin-top:6px" data-i18n="success.share">Share this code with your team.</div>
    </div>
    <div style="display:flex;flex-direction:column;gap:10px">
      <a class="btn btn-primary btn-lg" id="open-db" href="#" data-i18n="success.open_db">Open DB →</a>
      <a class="btn" id="open-nesting" href="#" data-i18n="success.open_nesting">Open Nesting →</a>
      <a class="btn" href="account.html" data-i18n="success.account">My account & billing</a>
    </div>
    <div class="muted-link" id="signin-note" style="margin-top:22px" data-i18n="success.signin_note">Sign in with the email and password you just created.</div>
  </div>
</div>
<script>
document.querySelectorAll("[data-brand]").forEach(function(el){ el.textContent = (window.FABSUITE&&FABSUITE.BRAND)||"CraftOS"; });
var ws = Fab.qs("ws");
if(ws) document.getElementById("ws").textContent = ws;
document.getElementById("open-db").href = FABSUITE.APP_URLS.db;
document.getElementById("open-nesting").href = FABSUITE.APP_URLS.nesting;
if(Fab.qs("demo")==="1"){
  var n=document.getElementById("signin-note");
  n.setAttribute("data-i18n","success.demo_note");
  if(window.I18N) n.textContent = I18N.t("success.demo_note");
}
</script>
</body>
</html>
