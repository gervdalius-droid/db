<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title data-i18n-title="meta.title.signup">Create your workspace</title>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<script src="config.js"></script>
<script src="i18n.js"></script>
<script src="fab.js"></script>
</head>
<body>
<nav class="nav"><div class="wrap"><a class="brand" href="index.html"><span class="logo">F</span> <span data-brand>CraftOS</span></a>
  <div class="links"><span class="lang-switch" data-lang-switch></span><a href="account.html" class="hide-sm" data-i18n="signup.have">Have an account?</a></div></div></nav>

<div class="shell">
  <div class="panel">
    <h2 data-i18n="signup.title">Create your workspace</h2>
    <div class="sub" id="plan-sub" data-i18n="signup.sub_none">Pick a plan on the home page.</div>

    <div id="demo-badge" style="display:none" class="pill blue" data-i18n="signup.demo_badge">Demo mode — no real charge</div>

    <div id="plan-box" style="display:none;background:var(--surface2);border:1px solid var(--border);border-radius:12px;padding:14px 16px;margin:14px 0 22px">
      <div style="display:flex;justify-content:space-between;align-items:center">
        <div><div style="font-weight:700" id="pb-name"></div><div style="font-size:13px;color:var(--muted)" id="pb-tag"></div></div>
        <div style="text-align:right"><div style="font-size:24px;font-weight:700" id="pb-price"></div><div style="font-size:12px;color:var(--hint)" id="pb-per"></div></div>
      </div>
      <div style="font-size:12px;color:var(--green-t);margin-top:8px" data-i18n="signup.trial_note">✓ 14-day free trial — your card is charged only after the trial.</div>
      <a href="index.html#pricing" style="font-size:12px;color:var(--blue);text-decoration:none;display:inline-block;margin-top:6px" data-i18n="signup.change_plan">← Change plan</a>
    </div>

    <form id="form" onsubmit="return false">
      <label data-i18n="signup.company">Company / workshop name</label>
      <input id="company" data-i18n-ph="signup.company_ph" autocomplete="organization">
      <label data-i18n="signup.email">Email (manager login)</label>
      <input id="email" type="email" data-i18n-ph="signup.email_ph" autocomplete="email">
      <label data-i18n="signup.password">Password</label>
      <input id="password" type="password" data-i18n-ph="signup.password_ph" autocomplete="new-password">
      <div class="err" id="err"></div>
      <button class="btn btn-primary btn-block btn-lg" id="go" style="margin-top:22px" onclick="submitForm()" data-i18n="signup.submit">Continue to payment →</button>
    </form>
    <div class="muted-link" data-i18n="signup.terms">By creating an account you agree to the terms of service.</div>
  </div>
</div>

<script>
var T = function(k,v){ return window.I18N ? I18N.t(k,v) : k; };
var BRAND = (window.FABSUITE && FABSUITE.BRAND) || "CraftOS";
document.querySelectorAll("[data-brand]").forEach(function(el){ el.textContent = BRAND; });

var PLAN = Fab.qs("plan") || "suite";
var INTERVAL = Fab.qs("interval") || "month";
var IS_DEMO = Fab.qs("demo") === "1";
if(!FABSUITE.PLANS[PLAN]) PLAN = "suite";

function renderPlan(){
  var cfg = FABSUITE.PLANS[PLAN];
  var price = INTERVAL==="year" ? cfg.year : cfg.month;
  var name = T("plan."+PLAN+".name");
  document.getElementById("plan-sub").textContent = T("signup.sub_plan", { name: name });
  document.getElementById("plan-box").style.display = "block";
  document.getElementById("pb-name").textContent = (PLAN==="suite") ? BRAND : (BRAND + " " + name);
  document.getElementById("pb-tag").textContent = T("plan."+PLAN+".tag");
  document.getElementById("pb-price").textContent = FABSUITE.CURRENCY + price;
  document.getElementById("pb-per").textContent = INTERVAL==="year" ? T("pricing.per_year") : T("pricing.per_month");
  if(IS_DEMO) document.getElementById("demo-badge").style.display = "inline-flex";
}
document.addEventListener("i18n:changed", renderPlan);

function showErr(m){ var e=document.getElementById("err"); e.textContent=m; e.classList.add("show"); }

async function submitForm(){
  var company = document.getElementById("company").value.trim();
  var email = document.getElementById("email").value.trim();
  var password = document.getElementById("password").value;
  document.getElementById("err").classList.remove("show");
  if(!company) return showErr(T("signup.err_company"));
  if(!email || email.indexOf("@")<0) return showErr(T("signup.err_email"));
  if(!password || password.length<6) return showErr(T("signup.err_password"));

  var btn = document.getElementById("go");
  btn.disabled = true; btn.innerHTML = '<span class="spin"></span> ' + T("signup.creating");
  try{
    var r = await Fab.signupAndCheckout({ email:email, password:password, company:company, plan:PLAN, interval:INTERVAL });
    if(r.url){ location.href = r.url; return; }
    showErr(T("signup.err_checkout"));
  }catch(e){
    showErr(e.message || T("signup.err_generic"));
  }finally{
    btn.disabled = false; btn.textContent = T("signup.submit");
  }
}
if(document.readyState!=="loading") renderPlan(); else document.addEventListener("DOMContentLoaded", renderPlan);
</script>
</body>
</html>
